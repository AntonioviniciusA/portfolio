<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Certificados</title>
    <style>
        .container {
            text-align: center;
        }

        .certificado {
            display: inline-block;
            margin: 10px;
        }

        img {
            width: 500px;
            height: auto;
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Meus Certificados</h1>
        <div id="certificados"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="cursor:pointer;">&times;</span>
            <h2 id="modal-title"></h2>
            <img id="modal-img" src="" alt="Certificado" style="max-width:100%;">
        </div>
    </div>

    <script>
        const certificados = [
            { src: "IMAGE/screenshot-1738172181108.png", title: "Power bi" },
            { src: "IMAGE/Captura de tela 2025-01-29 144523.png", title: "Detalhes do Certificado 2" }
        ];

        function renderCertificados() {
            const container = document.getElementById("certificados");
            container.innerHTML = "";
            certificados.forEach(cert => {
                const div = document.createElement("div");
                div.classList.add("certificado");
                div.innerHTML = `
                    <img src="${cert.src}" alt="${cert.title}">
                    <button onclick="openModal('${cert.src}', '${cert.title}')">Detalhes</button>
                `;
                container.appendChild(div);
            });
        }

        function openModal(src, title) {
            document.getElementById("modal-img").src = src;
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        renderCertificados();
    </script>
</body>

</html>
